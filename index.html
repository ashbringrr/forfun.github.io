<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORFUN — Mod Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0c;
    --bg-raise: #131317;
    --card: #17171c;
    --card-border: #26262e;
    --text: #eef0f4;
    --text-dim: #8c8c99;
    --accent: #2f6fff;
    --accent-dim: #1c3f96;
    --caution: #f3c33c;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  ::selection{background:var(--accent);color:#fff;}

  /* ---- header / hero ---- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(10,10,12,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--card-border);
  }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .wordmark{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:22px;
    letter-spacing:0.04em; display:flex; align-items:center; gap:10px;
  }
  .wordmark .plate{
    background:var(--text); color:#0a0a0c; font-family:var(--mono);
    font-size:11px; font-weight:500; padding:3px 7px; border-radius:3px;
    letter-spacing:0.06em;
  }
  .stat-line{font-family:var(--mono); font-size:12px; color:var(--text-dim);}

  .hero{max-width:1180px; margin:0 auto; padding:56px 24px 32px;}
  .hero-eyebrow{
    font-family:var(--mono); font-size:12px; color:var(--accent);
    letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;
  }
  .hero h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(32px,5vw,54px);
    line-height:1.02; margin:0 0 14px; letter-spacing:-0.01em;
  }
  .hero h1 span{color:var(--accent);}
  .hero p{color:var(--text-dim); max-width:520px; font-size:15px; line-height:1.55; margin:0;}

  /* ---- controls ---- */
  .controls{
    max-width:1180px; margin:0 auto; padding:0 24px 28px;
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  }
  .search-box{
    flex:1 1 280px; position:relative;
  }
  .search-box input{
    width:100%; background:var(--bg-raise); border:1px solid var(--card-border);
    color:var(--text); font-family:'Inter',sans-serif; font-size:14px;
    padding:11px 14px 11px 38px; border-radius:8px; outline:none;
    transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--accent);}
  .search-box svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.5;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:var(--mono); font-size:12px; padding:8px 13px; border-radius:20px;
    border:1px solid var(--card-border); background:var(--bg-raise); color:var(--text-dim);
    cursor:pointer; user-select:none; transition:all .15s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent-dim); color:var(--text);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* ---- grid ---- */
  main{max-width:1180px; margin:0 auto; padding:0 24px 80px;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:12px;
    overflow:hidden; display:flex; flex-direction:column; transition:transform .15s, border-color .15s;
  }
  .card:hover{border-color:var(--accent-dim); transform:translateY(-2px);}
  .card-media{
    height:132px; background:
      repeating-linear-gradient(135deg, #1b1b21 0 12px, #1c1c22 12px 24px);
    display:flex; align-items:center; justify-content:center;
    position:relative; border-bottom:1px solid var(--card-border);
  }
  .card-media .class-badge{
    position:absolute; top:10px; left:10px;
    background:rgba(10,10,12,0.85); border:1px solid var(--card-border);
    font-family:var(--mono); font-size:10px; letter-spacing:0.06em;
    padding:4px 8px; border-radius:5px; color:var(--text-dim); text-transform:uppercase;
  }
  .card-media .car-glyph{font-size:34px; opacity:0.35;}
  .card-body{padding:16px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .car-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; line-height:1.2;}
  .car-id{font-family:var(--mono); font-size:11px; color:var(--text-dim); word-break:break-all;}
  .meta-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; color:var(--text-dim); margin-top:auto; padding-top:4px;
  }
  .server-tag{
    background:#000; border:1px solid #2a2a2a; font-family:var(--mono);
    font-size:10px; padding:3px 8px; border-radius:4px; letter-spacing:0.05em;
  }
  .verified{display:flex; align-items:center; gap:4px; color:#5ad17e; font-size:11px;}
  .verified svg{width:11px; height:11px;}

  .dl-row{display:flex; gap:8px; padding:0 16px 16px;}
  .dl-btn{
    flex:1; background:var(--accent); color:#fff; text-decoration:none;
    text-align:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:13px;
    letter-spacing:0.03em; padding:11px 0; border-radius:8px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
    transition:background .15s;
  }
  .dl-btn:hover{background:#4a80ff;}
  .copy-btn{
    width:42px; background:var(--bg-raise); border:1px solid var(--card-border);
    border-radius:8px; color:var(--text-dim); cursor:pointer; display:flex;
    align-items:center; justify-content:center; transition:all .15s;
  }
  .copy-btn:hover{border-color:var(--accent); color:var(--text);}
  .copy-btn.copied{color:#5ad17e; border-color:#5ad17e;}

  .empty{
    text-align:center; padding:80px 20px; color:var(--text-dim);
    font-family:var(--mono); font-size:13px; grid-column:1/-1;
  }

  footer{
    border-top:1px solid var(--card-border); padding:24px; text-align:center;
    color:var(--text-dim); font-size:12px; font-family:var(--mono);
  }

  @media (max-width: 560px){
    .header-inner{padding:14px 16px;}
    .stat-line{display:none;}
    .hero{padding:36px 16px 24px;}
    .controls{padding:0 16px 22px;}
    main{padding:0 16px 60px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="wordmark">FORFUN <span class="plate">MOD GARAGE</span></div>
    <div class="stat-line" id="countLine">— cars</div>
  </div>
</header>

<div class="hero">
  <div class="hero-eyebrow">Server access guide</div>
  <h1>Pick a car.<br>Hit <span>download</span>. Go race.</h1>
  <p>Every mod running on the FORFUN server, in one place. Search by name, filter by class, and grab the link — no more scrolling a spreadsheet.</p>
</div>

<div class="controls">
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8c8c99" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="Search car name or ID…">
  </div>
  <div class="chip-row" id="chipRow"></div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>FORFUN GARAGE — links open external hosts. verify checksums before install.</footer>

<script>
/* ============================================================
   EDIT YOUR CATALOG HERE.
   Add one object per car. class = badge shown on the card and
   used for filter chips. server = which server it runs on.
   ============================================================ */
const CARS = [
  { name: "Mercedes-AMG GT63 (Khartoum)", id: "mercedes_amg_gt63_khartoum", class: "GT3", server: "FORFUN", url: "https://modsfire.com/g8hk0xKAmDoV0CV", image: "images/mercedes%20gt63%20khartoum.jpg", verified: true },
  { name: "BMW M4", id: "ks_bmw_m4_zhdxash", class: "Performance", server: "FORFUN", url: "https://modsfire.com/cfD6OCOs663kUdu", image: "images/ksbmwm4.jpg", verified: true },
  { name: "BMW E92 335d", id: "ckyp_bmw_e92_335d_zhdxsolo", class: "Performance", server: "FORFUN", url: "https://modsfire.com/573675EO5LG8V92", image: "images/e92.jpg", verified: true },
  { name: "Nissan GT-R '21", id: "nissan_gtr_21_zhdxash-v2", class: "Performance", server: "FORFUN", url: "https://modsfire.com/L7k2Ir9rjxEOhVU", image: "images/nissan%20gtr%2021.jpg", verified: true },
  { name: "BMW M3 G80 V2", id: "bmw_m3_g80_v2", class: "Performance", server: "FORFUN", url: "https://modsfire.com/ooqd7mEt8k2kjys", image: "images/m3g80v2.jpg", verified: true },
  { name: "Toyota GR Corolla", id: "toyota_gr_corolla_zhdxash", class: "Performance", server: "FORFUN", url: "https://modsfire.com/Zv4iIWzk6VG1CPJ", image: "images/corolla.png", verified: true },
  { name: "BMW E36", id: "bmw_e36_zhdxash", class: "Street", server: "FORFUN", url: "https://modsfire.com/115G518F9X101sP", image: "images/e36.jpg", verified: true },
  { name: "BMW 1M", id: "bmw_1m_zhdxash", class: "Performance", server: "FORFUN", url: "https://modsfire.com/75Kw1xr8gZ1Ro5q", verified: true },
  { name: "BMW M3 G80 ST2", id: "bmw_m3_g80_st2_zhoodxashxx", class: "Performance", server: "FORFUN", url: "https://modsfire.com/K7MScgu3XuCqHst", image: "images/m3g80.jpg", verified: true },
  { name: "BMW M4 CSL", id: "m4csl_zhdxash", class: "Performance", server: "FORFUN", url: "https://modsfire.com/Eg7809U6iC9p9uc", image: "images/m4csl.jpg", verified: true },
  { name: "BMW M4 Stage 2 (Mafia)", id: "bmw_m4_stage2_mafia_zhoodxashxx", class: "Performance", server: "FORFUN", url: "https://modsfire.com/1kMW9i0hK1V78G2", image: "images/m4%20mafia.jpg", verified: true },
  { name: "Chevy SS 2015", id: "chevy_ss_2015_zhdxash", class: "Street", server: "FORFUN", url: "https://modsfire.com/dKcfu9G6QqCasxI", image: "images/chevy%20ss.jpg", verified: true },
  { name: "Cadillac CT5-V", id: "cadillac_ct5-v_zhoodxashxx", class: "Street", server: "FORFUN", url: "https://modsfire.com/mnm602Ph9FUbrLF", verified: true },
  { name: "Hyundai Avante N", id: "zhd_hyundai_avante_n_xashxx", class: "Street", server: "FORFUN", url: "https://modsfire.com/h8Sy32u867xTGqE", verified: true },
  { name: "Kia Cerato Koup", id: "kia_cerato_koup_zhdxash", class: "Street", server: "FORFUN", url: "https://modsfire.com/K9Azm9vPuf9e3a2", image: "images/kia%20cerato.jpg", verified: true },
  { name: "Peugeot 308 (2022)", id: "zhd_peugeot_308_2022xashxx", class: "Street", server: "FORFUN", url: "https://modsfire.com/2aFy8174wm2Wr3M", image: "images/peugeot%20308.jpg", verified: true },
  { name: "VW Golf Mk6", id: "vw_golf_mk6_zhdxash", class: "Street", server: "FORFUN", url: "https://modsfire.com/u5MLIcJsH09LIf4", image: "images/golf%20mk6.jpg", verified: true },
  { name: "VW Golf GTI", id: "vw_golf_gti_zhdxash", class: "Street", server: "FORFUN", url: "https://modsfire.com/z0Yvy97326qHTP5", image: "images/golf%20gti.jpg", verified: true },
  { name: "Traffic Pack", id: "traffic_pack", class: "Traffic", server: "FORFUN", url: "https://modsfire.com/WJku0n6jO1lA1dt", verified: true },
  { name: "Traffic — Microbus EGY", id: "traffic_zhood_microbusegy", class: "Traffic", server: "FORFUN", url: "https://modsfire.com/6q8iSOvMu7bcN7D", verified: true },
  { name: "Traffic — GT-R", id: "traffic_gtr_zhdxash-1.2", class: "Traffic", server: "FORFUN", url: "https://modsfire.com/Dm07jN1HeWF5Ihz", verified: true },
  { name: "Traffic — Isuzu Tanker", id: "traffic_zhd_isuzu_tanker", class: "Traffic", server: "FORFUN", url: "https://modsfire.com/3Gc0Kt808V8si0t", verified: true },
  { name: "Traffic — Ford Transit", id: "traffic_zhd_for_transit", class: "Traffic", server: "FORFUN", url: "https://modsfire.com/C0a3p1eZ00rN977", verified: true },
  { name: "Traffic — Subaru Impreza", id: "traffic_sub_impreza_zhdxash-1.2", class: "Traffic", server: "FORFUN", url: "https://modsfire.com/Pu3MH4hBel0StoU", verified: true },
  { name: "Suzuki Carry Wagon", id: "zhd_suzukicarry_wagon", class: "Traffic", server: "FORFUN", url: "https://modsfire.com/yDigP1gd2CH0R7K", verified: true },
  { name: "Hyundai Elantra (by Diz)", id: "diz_hyundai_elantra", class: "Street", server: "FORFUN", url: "https://modsfire.com/THZJGtu4867j419", verified: true }
];

const grid = document.getElementById('grid');
const chipRow = document.getElementById('chipRow');
const searchInput = document.getElementById('searchInput');
const countLine = document.getElementById('countLine');

let activeClass = 'All';

function classes(){
  return ['All', ...new Set(CARS.map(c => c.class))];
}

function renderChips(){
  chipRow.innerHTML = '';
  classes().forEach(cls => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (cls === activeClass ? ' active' : '');
    chip.textContent = cls;
    chip.onclick = () => { activeClass = cls; renderChips(); renderGrid(); };
    chipRow.appendChild(chip);
  });
}

function carGlyph(cls){
  const glyphs = {GT3:'◈', Street:'▲', Drift:'✦'};
  return glyphs[cls] || '●';
}

function renderGrid(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = CARS.filter(c => {
    const matchesClass = activeClass === 'All' || c.class === activeClass;
    const matchesQuery = !q || c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q);
    return matchesClass && matchesQuery;
  });

  countLine.textContent = `${filtered.length} / ${CARS.length} cars`;

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty">no cars match “${q}”. try a different search or class.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => `
    <div class="card">
      <div class="card-media">
        <div class="class-badge">${c.class}</div>
        ${c.image
          ? `<img src="${c.image}" alt="${c.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
          : `<div class="car-glyph">${carGlyph(c.class)}</div>`}
      </div>
      <div class="card-body">
        <div class="car-name">${c.name}</div>
        <div class="car-id">${c.id}</div>
        <div class="meta-row">
          <span class="server-tag">${c.server}</span>
          ${c.verified
            ? `<span class="verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>verified</span>`
            : `<span style="color:#8c8c99">unverified</span>`}
        </div>
      </div>
      <div class="dl-row">
        <a class="dl-btn" href="${c.url}" target="_blank" rel="noopener">DOWNLOAD</a>
        <button class="copy-btn" data-url="${c.url}" title="Copy link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = () => {
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 1200);
      });
    };
  });
}

searchInput.addEventListener('input', renderGrid);
renderChips();
renderGrid();
</script>
</body>
</html>
